services:
  database:
    image: mariadb:11
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: diplomDB
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIABD_USER_PASSWORD}

  backend:
    build:
      context: ./backend
    image: diplomarbeit-backend:latest
    restart: unless-stopped
    environment:
      BACKEND_PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: diplomDB
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIABD_USER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      - database

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
    image: diplomarbeit-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

