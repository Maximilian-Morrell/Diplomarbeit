services:
  database:
    image: mariadb:11
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: diplomDB
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIABD_USER_PASSWORD}

  backend:
    build:
      context: ./backend
    image: diplomarbeit-backend:latest
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
    environment:
      BACKEND_PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: diplomDB
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIABD_USER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      UPLOAD_DIR: /app/uploads
    depends_on:
      database:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
    image: diplomarbeit-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: diplomarbeit-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    container_name: diplomarbeit-ollama-init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if ollama show lfm3 >/dev/null 2>&1; then
          echo "lfm3 is already downloaded."
        else
          echo "qwen3 not found. Downloading..."
          ollama pull lfm3
        fi
        echo "Ollama initialization completed."

volumes:
  uploads_data:
  ollama_data:
